name: Android CI/CD - Release APK

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Decode Keystore from GitHub Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{"{{"}} secrets.SIGNING_KEYSTORE_BASE64 {{"}}"}}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "Warning: SIGNING_KEYSTORE_BASE64 secret not found. Release build may fail if signing is strictly enforced."
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{"{{"}} secrets.STORE_PASSWORD {{"}}"}}
          KEY_PASSWORD: ${{"{{"}} secrets.KEY_PASSWORD {{"}}"}}
        run: ./gradlew assembleRelease

      - name: Generate Version Tag & Timestamp
        id: meta
        run: |
          VERSION=$(date +'%Y.%m.%d.%H%M%S')
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=NexusVPN Release v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            Automated production release built via GitHub Actions CI/CD.
            - WireGuard high-performance VPN tunnel
            - AdMob Rewarded & Interstitial monetization
            - Dynamic Remote Config & Admin Panel sync
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{"{{"}} secrets.GITHUB_TOKEN {{"}}"}}

      - name: Upload Release APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{"{{"}} secrets.GITHUB_TOKEN {{"}}"}}
